<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic History - Tarihin En Epik Hali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #0f0f23; --darker: #1a1a2e; }
        [data-theme="light"] { --gold: #b8860b; --dark: #f8f9fa; --darker: #e9ecef; background:#f8f9fa; color:#212529; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: #f8f9fa; transition: all 0.4s; }
        .cinzel { font-family: 'Cinzel', serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen">

<header class="text-center py-12">
    <h1 class="text-6xl cinzel text-var(--gold)">EPIC HISTORY</h1>
    <p class="text-xl opacity-80">Tarih • Hikâye • Podcast</p>
    <button id="themeBtn" class="mt-4 px-6 py-2 glass rounded-full">Dark/Light</button>
</header>

<div class="max-w-7xl mx-auto px-4 grid md:grid-cols-4 gap-8">
    <!-- Sol Menü + Filtreler -->
    <aside class="space-y-6">
        <div class="glass p-6 rounded-xl">
            <input id="search" placeholder="Ara..." class="w-full bg-transparent border-b border-gray-500 pb-2 outline-none">
            <div class="flex gap-2 mt-4 flex-wrap">
                <select id="civFilter" class="glass px-3 py-1 rounded"><option>Tüm Uygarlıklar</option><option>Roman</option><option>Osmanlı</option><option>Bizans</option></select>
                <button id="clearBtn" class="glass px-4 py-1 rounded">Temizle</button>
            </div>
        </div>

        <!-- Zaman Tüneli -->
        <div class="glass p-6 rounded-xl">
            <h3 class="cinzel text-xl mb-4">Zaman Tüneli</h3>
            <input type="range" min="-3000" max="2025" value="0" class="w-full" id="yearSlider">
            <p class="text-center mt-2">M.Ö. 3000 ——— <span id="yearDisplay">0</span> ——— M.S. 2025</p>
        </div>
    </aside>

    <!-- Ana İçerik -->
    <main class="md:col-span-2 space-y-12">
        <section id="articles"></section>
        <section id="podcast" class="glass p-8 rounded-xl"></section>
    </main>

    <!-- Sağ Sidebar - Karakterler -->
    <aside id="figures" class="space-y-6"></aside>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center z-50" onclick="this.hidden=true">
    <div class="glass p-8 max-w-4xl max-h-screen overflow-y-auto rounded-xl" onclick="event.stopPropagation()">
        <button class="float-right text-3xl" onclick="document.getElementById('modal').hidden=true">×</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>
    // Tema değiştirici
    document.getElementById('themeBtn').onclick = () => {
        const isLight = document.documentElement.dataset.theme === 'light';
        document.documentElement.dataset.theme = isLight ? 'dark' : 'light';
    };

    // Veri yükleme (CMS’ten)
    let articles = [], figures = [];

    async function loadData() {
        // articles.json ve figures.json oluşturacağız
        try {
            articles = await (await fetch('/content/articles.json')).json();
            figures  = await (await fetch('/content/figures.json')).json();
        } catch(e) {
            articles = []; figures = [];
        }
        render();
    }

    function render() {
        // Makaleler
        document.getElementById('articles').innerHTML = 
            `<h2 class="cinzel text-4xl mb-8">Makaleler</h2>` +
            articles.map(a => `
                <div class="glass p-6 rounded-xl cursor-pointer hover:ring-2 hover:ring-var(--gold)" onclick="openModal(\`${a.body}\`, '${a.title}')">
                    <img src="${a.image}" class="w-full h-64 object-cover rounded-lg mb-4">
                    <h3 class="cinzel text-2xl">${a.title}</h3>
                    <p class="opacity-80">${a.excerpt}</p>
                    <small>${a.year} • ${a.civilization}</small>
                </div>
            `).join('');

        // Karakterler
        document.getElementById('figures').innerHTML = 
            `<h3 class="cinzel text-2xl mb-4">Tarihi Karakterler</h3>` +
            figures.map(f => `
                <div class="glass p-4 rounded-lg cursor-pointer" onclick="openModal(\`${f.body}\`, '${f.name}')">
                    <img src="${f.image}" class="w-full h-48 object-cover rounded-lg">
                    <h4 class="cinzel text-xl mt-2">${f.name}</h4>
                </div>
            `).join('');
    }

    function openModal(html, title = '') {
        document.getElementById('modalContent').innerHTML = `<h2 class="cinzel text-3xl mb-6">${title}</h2>` + html;
        document.getElementById('modal').hidden = false;
    }

    // Filtreleme + Zaman tüneli (temel)
    document.getElementById('yearSlider').oninput = (e) => {
        document.getElementById('yearDisplay').textContent = e.target.value;
    };

    loadData();
</script>
</body>
</html>
