backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: articles
    label: Makaleler
    folder: content/articles
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Özet", name: "excerpt", widget: "text"}
      - {label: "Yıl", name: "year", widget: "number"}
      - {label: "Uygarlık", name: "civilization", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "İçerik", name: "body", widget: "markdown"}
